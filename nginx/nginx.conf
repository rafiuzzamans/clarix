events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    sendfile    on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream auth_service    { server auth-service:8001; }
    upstream user_service    { server user-service:8002; }
    upstream case_service    { server case-service:8003; }
    upstream ai_service      { server ai-service:8004; }
    upstream chatbot_service { server chatbot-service:8005; }
    upstream automation_svc  { server automation-service:8006; }
    upstream notif_service   { server notification-service:8007; }
    upstream analytics_svc   { server analytics-service:8008; }
    upstream file_service    { server file-service:8009; }
    upstream audit_service   { server audit-service:8010; }
    upstream web_app         { server web-app:3000; }

    server {
        listen 80;
        server_name localhost;


        # ── Auth Service ──────────────────────────────────────
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://auth_service/auth;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── User Service ──────────────────────────────────────
        location /api/users {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://user_service/users;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Case Service ──────────────────────────────────────
        location /api/cases {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://case_service/cases;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── AI Service ────────────────────────────────────────
        location /api/ai {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://ai_service/ai;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Chatbot Service ───────────────────────────────────
        location /api/chatbot {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://chatbot_service/chatbot;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Automation Service ────────────────────────────────
        location /api/automation {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://automation_svc/automation;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Notification Service ──────────────────────────────
        location /api/notifications {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://notif_service/notifications;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Analytics Service ─────────────────────────────────
        location /api/analytics {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://analytics_svc/analytics;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── File Service ──────────────────────────────────────
        location /api/files {
            limit_req zone=api burst=10 nodelay;
            client_max_body_size 20M;
            proxy_pass         http://file_service/files;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Audit Service ─────────────────────────────────────
        location /api/audit {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://audit_service/audit;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Web App (Next.js) ─────────────────────────────────
        location / {
            proxy_pass         http://web_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}

